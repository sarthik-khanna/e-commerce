# Local Postgres for development, plus an optional production-like app container.
#
#   docker compose up -d db              # just the database (use with `npm run dev`)
#   docker compose --profile app up -d   # database + built app on :3000
#
# With `db` running, set in .env:
#   DATABASE_URL="postgresql://postgres:postgres@localhost:5432/enterprise_ecommerce"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/enterprise_ecommerce
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
